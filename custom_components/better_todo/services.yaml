add_task:
  fields:
    list:
      required: true
      example: "Haushaltsaufgaben"
      selector:
        text:
    title:
      required: true
      example: "Wäsche aufhängen"
      selector:
        text:
    notes:
      required: false
      selector:
        text:
          multiline: true
    type:
      required: false
      default: simple
      selector:
        select:
          options:
            - simple
            - scheduled
            - after_completion
            - period
    due_date:
      required: false
      example: "2026-09-01"
      selector:
        date:
    due_time:
      required: false
      example: "18:40"
      selector:
        time:
    visible_from:
      required: false
      selector:
        date:
    lead_days:
      required: false
      selector:
        number:
          min: 0
          max: 365
    assigned_to:
      required: false
      selector:
        entity:
          domain: person
          multiple: true
    tags:
      required: false
      example: "house, urgent"
      selector:
        text:
    priority:
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 5
          step: 1
    reminders:
      required: false
      example: "60, 1440"
      selector:
        text:
    overdue_repeat:
      required: false
      example: 15
      selector:
        number:
          min: 1
          max: 43200
          step: 1
          unit_of_measurement: min
    location:
      required: false
      example: '{"zone": "zone.home", "mode": "inside"}'
      selector:
        object:
    schedule:
      required: false
      example: '{"freq": "monthly", "interval": 1, "day": 1}'
      selector:
        object:
    interval:
      required: false
      example: '{"unit": "months", "value": 1}'
      selector:
        object:
    period:
      required: false
      selector:
        select:
          options:
            - week
            - month

get_tasks:
  fields:
    list:
      required: false
      example: "Household"
      selector:
        text:
    assigned_to:
      required: false
      selector:
        entity:
          domain: person
          multiple: true
    include_unassigned:
      required: false
      default: true
      selector:
        boolean:
    tags:
      required: false
      example: "house"
      selector:
        text:
    status:
      required: false
      default: open
      selector:
        select:
          options:
            - open
            - done
            - all
    due:
      required: false
      selector:
        select:
          options:
            - today
            - overdue
            - week
    priority:
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 5
          step: 1

complete_task:
  fields:
    task_id:
      required: false
      selector:
        text:
    title:
      required: false
      example: "Wäsche aufhängen"
      selector:
        text:
    list:
      required: false
      example: "Haushaltsaufgaben"
      selector:
        text:
    all:
      required: false
      default: false
      selector:
        boolean:

