name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  versions:
    name: Card version matches manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          m=$(python3 -c "import json;print(json.load(open('custom_components/better_todo/manifest.json'))['version'])")
          c=$(sed -n 's/^const CARD_VERSION = "\(.*\)";$/\1/p' custom_components/better_todo/www/better-todo-card.js)
          echo "manifest=$m card=$c"
          test "$m" = "$c"

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
